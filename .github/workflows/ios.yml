# Builds the iPhone app on GitHub's Macs (no Mac needed): Actions tab > "iOS app" > the run >
# Artifacts > Boostimise-ipa. The .ipa is unsigned; Sideloadly (Windows) signs it with your Apple ID
# while installing it on the iPhone (see ios/README.md).
name: iOS app

on:
  push:
    paths:
      - "ios/**"
      - "android/app/src/main/assets/**"
      - "core/code_samples.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac to build on (macos-15-intel when GitHub has no free Apple-chip Macs)"
        default: macos-15
        type: choice
        options: [macos-15, macos-15-intel]

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The code reader (Core/ProductCode.swift) against the samples every Boostimise app is checked with
      - name: Check the code reader
        working-directory: ios
        run: |
          mkdir -p build
          swiftc -o build/check-codes Boostimise/Sources/Core/Regex.swift Boostimise/Sources/Core/Codes.swift \
            Boostimise/Sources/Core/JSON.swift Boostimise/Sources/Core/ProductCode.swift CodeSamplesCheck/*.swift
          build/check-codes ../core/code_samples.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set +e
          xcodebuild -project Boostimise.xcodeproj -scheme Boostimise -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          set -e
          # the compiler errors, short paths, each once
          grep -E "error:" build.log | sed -E 's#^.*/(Sources|Boostimise)/#\1/#' | sort -u > errors.txt || true
          echo "xcodebuild exit $status, $(wc -l < errors.txt) error line(s)"
          cat errors.txt
          tail -25 build.log
          # shown on the run's page (GitHub shows at most 10 of each kind per step)
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          sed -n '1,10p' errors.txt | esc | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '11,20p' errors.txt | esc | while IFS= read -r l; do echo "::warning::$l"; done
          sed -n '21,30p' errors.txt | esc | while IFS= read -r l; do echo "::notice::$l"; done
          { echo '### Build errors'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test $status -eq 0
          # a real app has its program inside (a failed build can leave an empty .app folder)
          test -f build/Build/Products/Release-iphoneos/Boostimise.app/Boostimise

      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Boostimise.app Payload/
          zip -qry Boostimise.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Boostimise-ipa
          path: ios/Boostimise.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
