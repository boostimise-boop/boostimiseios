# XcodeGen spec for the iPhone app: `xcodegen generate` (on a Mac or in CI) writes Boostimise.xcodeproj.
name: Boostimise
options:
  bundleIdPrefix: com.boostimise
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.16"
    CURRENT_PROJECT_VERSION: "17"
packages:
  PhoneNumberKit:
    url: https://github.com/marmelroy/PhoneNumberKit
    majorVersion: 3.7.0
targets:
  Boostimise:
    type: application
    platform: iOS
    sources:
      - path: Boostimise
      # the WhatsApp bridges and the phone list, shared with the Android app (one copy for both)
      - path: ../android/app/src/main/assets
        buildPhase: resources
    dependencies:
      - package: PhoneNumberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boostimise.app
        INFOPLIST_FILE: Boostimise/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    scheme: {}
